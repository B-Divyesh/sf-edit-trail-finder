name: Verify native release binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native-help:
    name: ${{ matrix.label }} binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            artifact: edit-trail-linux-x86_64
            binary: target/release/edit-trail
            build: cargo build --release
          - label: macOS arm64
            os: macos-14
            artifact: edit-trail-macos-arm64
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/edit-trail
            build: cargo build --release --target aarch64-apple-darwin
          - label: macOS x64
            os: macos-15-intel
            artifact: edit-trail-macos-x86_64
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/edit-trail
            build: cargo build --release --target x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            artifact: edit-trail-windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/edit-trail.exe
            build: cargo build --release --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: ${{ matrix.build }}
      - name: Run CLI help
        shell: bash
        run: ${{ matrix.binary }} --help
      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
